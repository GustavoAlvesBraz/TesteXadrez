<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <title>Aberturas</title>
</head>
<body>
<br>
<h2>Escolha corretamente de acordo com seu estilo de jogo</h2>
<br>
<p>Você prefere partidas que tendem a ir pra finais/jogar posições de finais ou posições de meio jogo?</p>
<br>
<label for="meiojogo">Meio-Jogo</label>
<input id="meiojogo" type="radio" name="preferencia" value="meiojogo">

<div>
<label for="final">Finais</label>
<input id="final" type="radio" name="preferencia" value="final">
</div>
<hr>
<h2>Agora escolha qual modalidade você joga mais</h2>
<hr>
<div>
    <label for="relampago">Relâmpago</label>
    <input id="relampago" type="radio" name="modalidade" value="1">
</div>
<div>
    <label for="rapido">Rápido</label>
    <input id="rapido" type="radio" name="modalidade" value="2">
</div>
<div>
    <label for="convencional">Convencional</label>
    <input id="convencional" type="radio" name="modalidade" value="3">
</div>
<button id="enviar">Enviar</button>
<p id="resultado"></p>
<script src="script.js"></script>
</body>
</html>
